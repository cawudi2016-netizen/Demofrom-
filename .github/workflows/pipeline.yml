name: Wellness Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'tourism_project/**'
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test_and_validate:
    name: Automated Testing and Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Establish Python 3.11 matching production runtime
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install pinned requirements and testing frameworks
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f tourism_project/deployment/requirements.txt ]; then
            pip install -r tourism_project/deployment/requirements.txt
          fi

      # Step 4: Code Quality and Syntax Checks
      - name: Code Quality Checks (Linting)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Step 5: Execute Automated Model Tests
      - name: Run Test Suite & Check Coverage
        run: |
          # Check if tests directory exists before running
          if [ -d "tests" ]; then
            pytest --cov=tourism_project --cov-report=term-missing
          else
            echo "No specific test suite found yet. Proceeding with integrity validations..."
          fi

      # Step 6: Verify Serialization Integrity of the Model
      - name: Model File Integration Validation
        run: |
          python -c "
          import joblib
          import os
          model_path = 'tourism_project/deployment/best_tourism_package_model_v1.joblib'
          assert os.path.exists(model_path), 'Error: Serialized model file is missing from production directory!'
          model = joblib.load(model_path)
          print('Model successfully loaded. Verified Pipeline Type:', type(model))
          "
